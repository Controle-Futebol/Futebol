<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Futebol Amador · Toledo</title>
<style>
  :root{--bg:#0e0f13;--card:#181a21;--txt:#f4f4f6;--mut:#9a9eac}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
  main{width:100%;max-width:440px}
  .ball{font-size:44px;text-align:center}
  h1{text-align:center;font-size:26px;margin:8px 0 4px;letter-spacing:.5px}
  .sub{text-align:center;color:var(--mut);font-size:14px;margin-bottom:28px}
  a.g{display:block;text-decoration:none;color:#fff;border-radius:18px;padding:22px 22px 20px;margin-bottom:16px;position:relative;overflow:hidden;transition:transform .12s}
  a.g:active{transform:scale(.98)}
  a.g small{display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.85;margin-bottom:6px}
  a.g b{display:block;font-size:22px}
  a.g span{display:block;margin-top:6px;font-size:14px;opacity:.9}
  a.g i{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-style:normal;font-size:30px;opacity:.9}
  .sexta{background:linear-gradient(135deg,#d71b2d,#f07a1a)}
  .vet{background:linear-gradient(135deg,#3d0a5c,#7b1fa2 60%,#00b894)}
  footer{margin-top:20px;color:var(--mut);font-size:12px;text-align:center}
</style>
</head>
<body>
<main>
  <div class="ball">⚽</div>
  <h1>Futebol Amador · Toledo</h1>
  <p class="sub">Escolha o grupo</p>

  <a class="g sexta" href="Painel_Sexta.html">
    <small>Sextas-feiras</small>
    <b>Croma 2 Futebol de Sexta</b>
    <span>Jogos, classificação, artilharia, pagamentos</span>
    <i>›</i>
  </a>

  <a class="g vet" href="Painel_Veteranos.html">
    <small>Terças-feiras</small>
    <b>Veteranos São Francisco</b>
    <span>Jogos, classificação, artilharia, pagamentos</span>
    <i>›</i>
  </a>

  <footer>Dica: no celular, use "Adicionar à tela inicial" no menu do navegador.</footer>
</main>
</body>
</html>
