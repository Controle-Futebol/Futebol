<!doctype html>
<html lang="pt-BR" data-g="ll">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0507">
<title>Croma 2 Futebol de Sexta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Temas por grupo: La Liga (sexta) e Premier League (terça) ===== */
:root,html[data-g="ll"]{
  --bg:#0b0507;--bg2:#1c0b0f;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.11);--line:rgba(255,255,255,.14);
  --ink:#fff;--mut:#c3b0b2;--acc:#ff4b3e;--acc2:#ff9d1c;--acc3:#fff;--onacc:#fff;
  --ok:#3ddc84;--okbg:rgba(61,220,132,.13);--warn:#ffcc4d;--warnbg:rgba(255,204,77,.13);--bad:#ff6b6b;--badbg:rgba(255,75,62,.15);
  --hero:linear-gradient(135deg,#2a0d12 0%,#0b0507 70%);
  --stripe:repeating-linear-gradient(115deg,rgba(255,75,62,.0) 0 22px,rgba(255,75,62,.22) 22px 34px);
}
html[data-g="pl"]{
  --bg:#16001f;--bg2:#3b0a4d;--card:rgba(255,255,255,.08);--card2:rgba(255,255,255,.14);--line:rgba(255,255,255,.18);
  --ink:#fff;--mut:#cdb8e0;--acc:#00ff85;--acc2:#e90052;--acc3:#04f5ff;--onacc:#2a0038;
  --ok:#00ff85;--okbg:rgba(0,255,133,.12);--warn:#ffd84d;--warnbg:rgba(255,216,77,.13);--bad:#ff5c8a;--badbg:rgba(233,0,82,.18);
  --hero:linear-gradient(135deg,#4d1362 0%,#16001f 75%);
  --stripe:radial-gradient(circle at 92% 14%,rgba(4,245,255,.30) 0 34px,transparent 35px),radial-gradient(circle at 80% 22%,rgba(233,0,82,.34) 0 22px,transparent 23px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg) 70%) fixed;min-height:100vh;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
h1,h2,h3,.disp{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;letter-spacing:.02em}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px 10px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .tbar{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font:800 17px "Barlow Condensed",sans-serif;flex:none}
.top h1{font-size:21px;margin:0;flex:1;font-weight:800;text-transform:uppercase}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;flex:none}
.ibtn svg{width:19px;height:19px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:880px;margin:10px auto 0}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:14px;padding:8px 10px;text-align:left;font:inherit;line-height:1.1;transition:.15s}
.seg button b{display:block;font:800 20px "Barlow Condensed",sans-serif;text-transform:uppercase;color:var(--ink)}
.seg button span{font-size:12px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.seg button.on b{color:var(--onacc)}
.seg button[data-v="Croma 2 Futebol de Sexta"].on{background:#ff4b3e;border-color:#ff4b3e;color:#fff}
.seg button[data-v="Croma 2 Futebol de Sexta"].on b{color:#fff}
.seg button[data-v="Veteranos São Francisco"].on{background:#00ff85;border-color:#00ff85;color:#2a0038}
.seg button[data-v="Veteranos São Francisco"].on b{color:#2a0038}

main{max-width:880px;margin:0 auto;padding:12px 14px 20px}
/* ---------- hero do grupo ---------- */
.hero{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:var(--hero);padding:18px 16px 14px;margin:2px 0 12px}
.hero::before{content:"";position:absolute;inset:0;background:var(--stripe);opacity:.55;pointer-events:none}
.hero>*{position:relative}
.hero .kick{font:700 12px Barlow,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--acc2)}
html[data-g="pl"] .hero .kick{color:var(--acc3)}
.hero h2{font:800 42px/.95 "Barlow Condensed",sans-serif;margin:4px 0 14px;text-transform:uppercase;display:block}
.hero h2::before{display:none}
.hero h2 em{display:block;font-style:normal;color:var(--acc);font-size:26px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stats b{display:block;font:800 26px/1 "Barlow Condensed",sans-serif;color:var(--acc)}
.stats span{font-size:12px;color:var(--mut)}

/* ---------- cartões ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h2{font-size:20px;margin:0 0 10px;font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--acc);flex:none}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--mut);font-weight:700;text-transform:uppercase}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:130px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.32);color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--acc)}
input[type=checkbox]{width:auto}
::placeholder{color:#ffffff66}
button{font:inherit;color:inherit;cursor:pointer}
button.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:14px;padding:13px 16px;font-weight:700}
button.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.btn.sec:active{background:var(--card2)}
button.btn.red{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
button.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
button:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:14px;user-select:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
.chip.gold.on{background:var(--acc2);border-color:var(--acc2);color:#1a0f00}
.chip.red.on{background:var(--bad);border-color:var(--bad);color:#2a0008}
.chip.ghost{border-style:dashed;color:var(--mut)}
.dot{width:11px;height:11px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.5)}
.mut{color:var(--mut);font-size:13px}

/* ---------- presença ---------- */
.pl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border:0}
.pl .n{flex:1;font-weight:600;min-width:0}
.pl .n small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.who{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;text-align:left;padding:4px 0}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:16px;line-height:1;color:transparent}
.who.on .chk{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.who.on{font-weight:700}
.counter{margin-left:auto;font:800 22px "Barlow Condensed",sans-serif;color:var(--acc)}

/* ---------- jogo ---------- */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:12px 0 4px}
.score .tm{display:flex;align-items:center;gap:8px;font:800 20px "Barlow Condensed",sans-serif;text-transform:uppercase;min-width:0}
.score .tm.r{justify-content:flex-end;text-align:right}
.score .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .mid{display:flex;align-items:center;gap:6px}
.score input{width:62px;text-align:center;font:800 34px "Barlow Condensed",sans-serif;padding:4px 0}
.score .x{font:800 24px "Barlow Condensed",sans-serif;color:var(--mut)}
.pm{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.golrow{display:flex;gap:6px;align-items:center;margin:6px 0}
.golrow select{flex:1;min-width:0}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px}
.stp b{min-width:22px;text-align:center;font:800 20px "Barlow Condensed",sans-serif}
.jhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.warn,.ok,.err{border-radius:12px;padding:9px 12px;font-size:14px;margin:8px 0;border:1px solid}
.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.err{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card2);color:var(--mut)}
.tag.w{background:var(--okbg);color:var(--ok)}.tag.d{background:var(--badbg);color:var(--bad)}

/* ---------- painel / tabelas ---------- */
.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border:0}
.rank .pos{width:30px;height:30px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font:800 17px "Barlow Condensed",sans-serif;color:var(--mut);flex:none}
.rank:nth-child(1) .pos{background:var(--acc);color:var(--onacc)}
.rank:nth-child(2) .pos{background:var(--acc2);color:#1a0f00}
.rank:nth-child(3) .pos{background:var(--acc3);color:#111}
.rank .nm{flex:1;min-width:0;font-weight:600}
.rank .val{font:800 18px "Barlow Condensed",sans-serif;text-align:right;white-space:nowrap}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:3px}
html[data-g="pl"] .bar>i{background:linear-gradient(90deg,var(--acc),var(--acc3))}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.match:last-child{border:0}
.match .tm{display:flex;align-items:center;gap:7px;font-weight:600;min-width:0}
.match .tm.r{justify-content:flex-end}
.gls{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;color:var(--mut);padding:0 4px 8px;border-bottom:1px solid var(--line)}
.gls .r{text-align:right}
.match .pl2{font:800 22px "Barlow Condensed",sans-serif;background:var(--card2);border-radius:10px;padding:2px 12px;white-space:nowrap}
details.card>summary{cursor:pointer;font:800 20px "Barlow Condensed",sans-serif;text-transform:uppercase;list-style:none}
details.card>summary::-webkit-details-marker{display:none}

/* ---------- financeiro ---------- */
.meter{height:12px;border-radius:7px;background:var(--card2);overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--ok);border-radius:7px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles div{border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.tiles .p{background:var(--okbg);border-color:var(--ok)}.tiles .q{background:var(--badbg);border-color:var(--bad)}
.tiles b{display:block;font:800 26px/1 "Barlow Condensed",sans-serif}
.tiles .p b{color:var(--ok)}.tiles .q b{color:var(--bad)}
.st{min-width:84px;text-align:center;border-radius:999px;padding:8px 12px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.st.Sim{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.st.Não{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.st.Isento{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}

/* ---------- barras fixas ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;gap:4px}
.nav button{flex:1;max-width:220px;margin:0 auto;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:12px;font-weight:600}
.nav svg{width:22px;height:22px}
.nav button.on{color:var(--acc)}
.nav button.on svg{filter:drop-shadow(0 0 6px var(--acc))}
.sticky{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:8px 14px;z-index:8;pointer-events:none}
.sticky .btn{width:100%;max-width:880px;display:block;margin:0 auto;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:17px;padding:15px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:20;max-width:90%;font-weight:600}
.hide{display:none!important}
dialog{border:1px solid var(--line);border-radius:18px;padding:18px;width:min(92vw,460px);background:var(--bg2);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{font-size:22px;text-transform:uppercase}
dialog#dlgCard{width:min(96vw,560px);max-height:94vh;padding:12px;overflow:auto}
#dlgCard .abas{display:flex;gap:8px;margin-bottom:10px}
#dlgCard .abas button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
#dlgCard .abas button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
#dlgCard .acoes{display:flex;gap:8px;margin-top:10px;position:sticky;bottom:0;background:var(--bg2);padding-top:6px}
#dlgCard .acoes .btn{flex:1}
@media (min-width:760px){ .hero h2{font-size:44px} .nav button{flex-direction:row;justify-content:center;gap:8px;font-size:14px} }
.ctbl{overflow-x:auto;margin:0 -4px}.ctbl table{border-collapse:collapse;width:100%;font-size:13px}
.ctbl th{color:var(--mut);font-weight:800;font-size:11px;letter-spacing:.04em;padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
.ctbl td{padding:9px 3px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07);font-variant-numeric:tabular-nums}
.ctbl th.nm,.ctbl td.nm{text-align:left;font-weight:700;font-size:14px}
.ctbl td.ps{color:var(--mut);font-weight:800;width:26px}
.ctbl td.pt{font-weight:900;font-size:15px;color:var(--acc)}
.ctbl tr.lider td.ps{color:var(--onacc);background:var(--acc);border-radius:6px;font-weight:900}
.ctbl tr.lider td.nm{color:var(--acc)}
.ytbl{overflow-x:auto;margin:0 -6px}.ytbl table{border-collapse:collapse;font-size:12px;width:100%;min-width:480px}
.ytbl th{color:var(--mut);font-weight:700;padding:6px 2px;text-align:center}
.ytbl td{padding:7px 2px;text-align:center;border-top:1px solid rgba(255,255,255,.1)}
.ytbl td:first-child,.ytbl th:first-child{text-align:left;font-weight:700;font-size:13px;padding-left:6px;min-width:92px;position:sticky;left:0;background:var(--card,#241033)}
.ytbl i.yd{display:inline-block;width:14px;height:14px;min-width:14px;border-radius:50%;background:rgba(255,255,255,.14);vertical-align:middle}.ytbl i.yd.y1{background:#3ddc84}.ytbl i.yd.y0{background:#e5484d}.ytbl i.yd.yi{background:#99aab5}.ytbl i.yd.yn{width:8px;min-width:8px;height:2px;border-radius:0;background:rgba(255,255,255,.28)}
.ytbl tr.tot td{font-weight:800;color:var(--mut)}
</style>
</head>
<body>
<header class="top">
  <div class="tbar">
    <div class="logo">C2</div>
    <h1>Croma 2</h1>
    <button class="ibtn" id="btnRef" title="Atualizar" aria-label="Atualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="ibtn" id="btnCfg" title="Configuração" aria-label="Configuração"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="seg" id="seg"></div>
</header>
<main id="app"></main>
<nav class="nav" id="nav">
  <button data-tab="lancar" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Lançar</button>
  <button data-tab="rodadas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M12 10v10"/></svg>Rodadas</button>
  <button data-tab="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Painel</button>
  <button data-tab="jogadores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></svg>Jogadores</button>
  <button data-tab="financeiro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.8 9a3 3 0 0 0-2.8-1.5c-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2A3.2 3.2 0 0 1 9 14.9M12 6v1.5M12 16.5V18"/></svg>Financeiro</button>
</nav>
<div id="toast"></div>

<dialog id="dlgCard">
  <div class="abas"><button data-act="cartaoAba" data-k="0" class="on">Rodada do dia</button><button data-act="cartaoAba" data-k="1">Temporada</button></div>
  <div id="cardPrev"></div>
  <div class="acoes"><button class="btn sec" data-act="cartaoFechar">Fechar</button><button class="btn sec" data-act="cartaoBaixar">Baixar</button><button class="btn" data-act="cartaoShare">Compartilhar</button></div>
</dialog>

<dialog id="dlgCfg">
  <h2 style="margin-top:0">Configuração</h2>
  <label>Endereço do Web App (termina em /exec)</label>
  <input id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <label style="margin-top:10px">PIN de lançamento</label>
  <input id="cfgPin" type="password" placeholder="PIN" autocomplete="off">
  <p class="mut">O endereço e o PIN ficam guardados só neste aparelho.</p>
  <div class="row" style="margin-top:10px"><button class="btn sec" id="cfgCancel">Cancelar</button><button class="btn" id="cfgSave">Salvar</button></div>
</dialog>

<script>
/* ====================== CONFIG ====================== */
const URL_PADRAO = 'https://script.google.com/macros/s/AKfycbznL4DCGnAV0DGufJYQbWH7OL7Y511PZbM2JX1HHBXiQ0tCj3x4r1tUjyfwQ_mW8LYt/exec';   // opcional: cole aqui o endereço /exec para não precisar digitar em cada aparelho
const GRUPOS = ['Croma 2 Futebol de Sexta'];
const TIMES = {
  'Croma 2 Futebol de Sexta': ['Azul', 'Verde', 'Amarelo', 'Vermelho'],
  'Veteranos São Francisco': ['Sem camisa', 'Com camisa', 'Azul', 'Vermelho']
};
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];


/* ====================== ESTADO ====================== */
const SOMENTE_LEITURA = false;   // true na versão para compartilhar (sem lançar, sem PIN)
const GERADO_EM = '';
const DADOS_EMBUTIDOS = null;

const cfg = {
  url: localStorage.getItem('ft_url') || URL_PADRAO,
  pin: localStorage.getItem('ft_pin') || ''
};
const GRUPO_DIA = { 'Croma 2 Futebol de Sexta': 5, 'Veteranos São Francisco': 2 };
const GRUPO_INFO = {
  'Croma 2 Futebol de Sexta': { curto: 'Croma 2', dia: 'Sexta', sub: 'Futebol de Sexta', tema: 'll', kick: 'La Liga · toda sexta' },
  'Veteranos São Francisco': { curto: 'Veteranos', dia: 'Terça', sub: 'São Francisco', tema: 'pl', kick: 'Premier League · toda terça' }
};
const DIAS_SEM = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
function isoDe(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dataDe(iso) { const p = String(iso).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
/** data do jogo mais recente (hoje, se for o dia do grupo) */
function dataPadrao(g) { const d = new Date(); while (d.getDay() !== GRUPO_DIA[g]) d.setDate(d.getDate() - 1); return isoDe(d); }
function dataProxima(g) { const d = new Date(); while (d.getDay() !== GRUPO_DIA[g]) d.setDate(d.getDate() + 1); return isoDe(d); }
const grupoInicial = (() => { const s = localStorage.getItem('ft_grupo'); return GRUPOS.includes(s) ? s : GRUPOS[0]; })();
const S = {
  tab: SOMENTE_LEITURA ? 'rodadas' : 'lancar', db: DADOS_EMBUTIDOS, carregando: false, msg: null,
  grupo: grupoInicial, data: dataPadrao(grupoInicial),
  pres: [], jogos: [], novos: [], carregadoKey: '',
  stGrupo: grupoInicial, stMetrica: 'gols',
  fnGrupo: grupoInicial, fnMes: mesLabel(new Date()), fnValor: '', fnSub: 'resumo', cxEdit: null
};
function aplicarTema() {
  document.documentElement.dataset.g = GRUPO_INFO[S.grupo].tema;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = GRUPO_INFO[S.grupo].tema === 'pl' ? '#16001f' : '#0b0507';
}
function setGrupo(g) {
  if (!GRUPOS.includes(g) || g === S.grupo) return;
  S.grupo = S.stGrupo = S.fnGrupo = g; S.data = dataPadrao(g); S.carregadoKey = ''; S.msg = null;
  try { localStorage.setItem('ft_grupo', g); } catch (e) { }
  aplicarTema();
}


function hojeISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function mesLabel(d) { return MESES[d.getMonth()] + '/' + d.getFullYear(); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmtData(iso) { const p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
function toast(t, ms) { const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', ms || 2600); }

/* ====================== API ====================== */
async function apiLer() {
  if (!cfg.url) throw new Error('Configure o endereço do Web App (botão Config).');
  const r = await fetch(cfg.url + (cfg.url.includes('?') ? '&' : '?') + 'action=read');
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || 'Falha ao ler');
  return j.dados;
}
async function apiGravar(body) {
  if (!cfg.url) throw new Error('Configure o endereço do Web App (botão Config).');
  if (!cfg.pin) throw new Error('Informe o PIN em Config.');
  const r = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({}, body, { pin: cfg.pin })) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || 'Falha ao gravar');
  return j;
}
async function carregar(quieto) {
  S.carregando = true; if (!quieto) render();
  try { S.db = await apiLer(); S.msg = null; S.carregadoKey = ''; }
  catch (e) { S.msg = { t: 'err', m: e.message }; }
  S.carregando = false; render();
}

/* ====================== LÓGICA ====================== */
const db = () => S.db || { jogadores: [], presenca: [], jogos: [], escalacao: [], gols: [], goleiros: [], financeiro: [], caixa: [], vaquinha: [] };
const ativos = g => db().jogadores.filter(p => p.grupo === g && p.ativo !== 'Não').map(p => p.nome);

/** Monta o formulário da rodada (existente ou em branco) para grupo+data */
function prepararRodada() {
  const key = S.grupo + '|' + S.data;
  if (S.carregadoKey === key) return;
  S.carregadoKey = key; S.novos = [];
  const D = db(), g = S.grupo, d = S.data;
  const prs = D.presenca.filter(r => r.grupo === g && r.data === d);
  const mapa = {}; prs.forEach(r => mapa[r.nome] = r);
  let nomes = ativos(g);
  prs.forEach(r => { if (!nomes.includes(r.nome)) nomes.push(r.nome); });
  S.pres = nomes.map(n => {
    const r = mapa[n];
    return { nome: n, conf: r ? r.confirmado || 'Não' : 'Não', veio: r ? r.compareceu === 'Sim' : false, obs: r ? r.obs || '' : '' };
  });
  S.jogos = D.jogos.filter(r => r.grupo === g && r.data === d).sort((a, b) => a.n - b.n).map(j => {
    const es = D.escalacao.filter(r => r.grupo === g && r.data === d && r.n === j.n);
    const gk = D.goleiros.filter(r => r.grupo === g && r.data === d && r.n === j.n);
    const gl = D.gols.filter(r => r.grupo === g && r.data === d && r.n === j.n);
    return {
      n: j.n, t1: j.time1, t2: j.time2, p1: j.p1, p2: j.p2, manual: true, obs: j.obs || '',
      esc1: es.filter(r => r.time === j.time1).map(r => r.nome), esc2: es.filter(r => r.time === j.time2).map(r => r.nome),
      g1: (gk.find(r => r.time === j.time1) || {}).goleiro || '', g2: (gk.find(r => r.time === j.time2) || {}).goleiro || '',
      gols: gl.map(r => ({ nome: r.nome, qtd: Number(r.gols) || 1, contra: r.contra === 'Sim' }))
    };
  });
  S.existente = S.jogos.length > 0 || prs.length > 0;
}

function placarAuto(j) {
  let a = 0, b = 0;
  j.gols.forEach(x => {
    const t1 = j.esc1.includes(x.nome), t2 = j.esc2.includes(x.nome);
    if (!t1 && !t2) return;
    const paraT1 = x.contra ? t2 : t1;
    if (paraT1) a += x.qtd; else b += x.qtd;
  });
  return [a, b];
}

/* ====================== ESTATÍSTICAS ====================== */
function estatisticas(grupo, ate) {
  const D = db(), tudo = grupo === 'Todos';
  const ok = r => (tudo || r.grupo === grupo) && (!ate || r.data <= ate);
  const P = {};
  const get = n => P[n] || (P[n] = { nome: n, gols: 0, contra: 0, jogos: 0, vit: 0, emp: 0, dias: 0, pres: 0, furou: 0, gj: 0, gs: 0 });
  const venc = {}, placar = {};
  D.jogos.filter(ok).forEach(j => {
    const k = j.grupo + '|' + j.data + '|' + j.n;
    placar[k] = j; venc[k] = j.p1 > j.p2 ? j.time1 : j.p2 > j.p1 ? j.time2 : 'Empate';
  });
  D.presenca.filter(ok).forEach(r => {
    const p = get(r.nome); p.dias++;
    if (r.compareceu === 'Sim') p.pres++;
    if (r.confirmado === 'Sim' && r.compareceu !== 'Sim') p.furou++;
  });
  const melhor = {};
  D.escalacao.filter(ok).forEach(r => {
    const k = r.grupo + '|' + r.data + '|' + r.n; if (!placar[k]) return;
    const res = venc[k] === r.time ? 2 : venc[k] === 'Empate' ? 1 : 0, pk = k + '|' + r.nome;
    if (!(pk in melhor)) melhor[pk] = { nome: r.nome, res }; else if (res > melhor[pk].res) melhor[pk].res = res;   // quem trocou de time no mesmo jogo conta 1 jogo (melhor resultado)
  });
  Object.keys(melhor).forEach(pk => { const m = melhor[pk], p = get(m.nome); p.jogos++; if (m.res === 2) p.vit++; else if (m.res === 1) p.emp++; });
  D.gols.filter(ok).forEach(r => { const p = get(r.nome); if (r.contra === 'Sim') p.contra += Number(r.gols) || 0; else p.gols += Number(r.gols) || 0; });
  D.goleiros.filter(ok).forEach(r => {
    const k = r.grupo + '|' + r.data + '|' + r.n, j = placar[k]; if (!j) return;
    const p = get(r.goleiro); p.gj++; p.gs += (r.time === j.time1 ? j.p2 : j.p1);
  });
  return Object.values(P);
}

function conferencia() {
  const D = db(), av = [];
  D.jogos.forEach(j => {
    const k = j.grupo === undefined ? '' : j.grupo;
    const gl = D.gols.filter(r => r.grupo === j.grupo && r.data === j.data && r.n === j.n);
    const es = D.escalacao.filter(r => r.grupo === j.grupo && r.data === j.data && r.n === j.n);
    let a = 0, b = 0;
    gl.forEach(x => {
      const t1 = (x.time === j.time1), pt1 = (x.contra === 'Sim') ? !t1 : t1;
      if (pt1) a += Number(x.gols) || 0; else b += Number(x.gols) || 0;
    });
    const nome = fmtData(j.data) + ' · jogo ' + j.n + ' · ' + j.grupo;
    if (gl.length && (a !== j.p1 || b !== j.p2)) av.push(nome + ': placar ' + j.p1 + 'x' + j.p2 + ', gols somam ' + a + 'x' + b);
    if (!gl.length && (j.p1 + j.p2) > 0) av.push(nome + ': placar sem gols lançados');
    if (!es.length) av.push(nome + ': sem escalação');
  });
  // nomes que não estão no cadastro do grupo (erros de digitação, ex.: Josue x Josué)
  GRUPOS.forEach(g => {
    const cad = new Set(D.jogadores.filter(p => p.grupo === g).map(p => p.nome)), fora = {};
    [['presença', D.presenca, 'nome'], ['escalação', D.escalacao, 'nome'], ['gols', D.gols, 'nome'], ['goleiros', D.goleiros, 'goleiro']].forEach(([rot, L, c]) => {
      L.filter(r => r.grupo === g && r[c] && !cad.has(r[c])).forEach(r => { (fora[r[c]] = fora[r[c]] || new Set()).add(rot); });
    });
    Object.keys(fora).forEach(n => av.push(g + ': "' + n + '" não está no cadastro (usado em ' + Array.from(fora[n]).join(', ') + ')'));
  });
  return av;
}

/* ====================== RENDER ====================== */
function corDot(n) { const c = corTime(n); return '<i class="dot" style="background:' + c.bg + '"></i>'; }
function render() {
  aplicarTema();
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  if (SOMENTE_LEITURA) { document.querySelector('#nav [data-tab=lancar]').classList.add('hide'); document.getElementById('btnRef').classList.add('hide'); document.getElementById('btnCfg').classList.add('hide'); }
  document.getElementById('seg').classList.toggle('hide', GRUPOS.length < 2);
  document.getElementById('seg').innerHTML = GRUPOS.map(g => {
    const I = GRUPO_INFO[g];
    return '<button data-act="setGrupo" data-v="' + esc(g) + '" class="' + (g === S.grupo ? 'on' : '') + '"><b>' + I.dia + '</b><span>' + I.curto + ' · ' + I.sub + '</span></button>';
  }).join('');
  const app = document.getElementById('app');
  let h = '';
  if (S.msg) h += '<div class="' + S.msg.t + '">' + esc(S.msg.m) + '</div>';
  if (S.carregando && !S.db) h += '<div class="card mut">Carregando dados da planilha…</div>';
  if (S.db) {
    if (SOMENTE_LEITURA) h += vHero() + '<div class="mut" style="margin:-4px 2px 10px">Somente leitura · dados de ' + esc(GERADO_EM) + '</div>';
    if (S.tab === 'lancar') h += vHero() + vLancar();
    else if (S.tab === 'rodadas') h += vRodadas();
    else if (S.tab === 'painel') h += vPainel();
    else if (S.tab === 'jogadores') h += vJogadores();
    else h += vFinanceiro();
  } else if (!S.carregando && !S.msg) {
    h += '<div class="card">Toque na engrenagem e informe o endereço do Web App e o PIN.</div>';
  }
  app.innerHTML = h;
  document.querySelectorAll('.chips.scroll .chip.on').forEach(c => { try { c.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) { } });
  const bar = document.getElementById('sticky');
  if (bar) bar.remove();
  if (S.db && S.tab === 'lancar') {
    const d = document.createElement('div'); d.id = 'sticky'; d.className = 'sticky';
    d.innerHTML = '<button class="btn" data-act="salvar">Salvar rodada · ' + fmtData(S.data).slice(0, 5) + '</button>';
    document.body.appendChild(d);
  }
}

function vHero() {
  const D = db(), g = S.grupo, I = GRUPO_INFO[g];
  const jg = D.jogos.filter(j => j.grupo === g);
  const rod = new Set(jg.map(j => j.data)).size;
  const at = ativos(g).length;
  return '<section class="hero"><div class="kick">' + I.kick + '</div><h2>' + esc(I.curto) + ' <em>' + esc(I.sub) + '</em></h2>' +
    '<div class="stats"><div><b>' + rod + '</b><span>rodadas</span></div><div><b>' + jg.length + '</b><span>jogos</span></div><div><b>' + at + '</b><span>ativos</span></div></div></section>';
}

/* ---- Lançar ---- */
function vLancar() {
  prepararRodada();
  const D = db(), g = S.grupo, I = GRUPO_INFO[g];
  const came = S.pres.filter(p => p.veio).map(p => p.nome);
  const wd = dataDe(S.data).getDay(), esperado = GRUPO_DIA[g];
  const datas = Array.from(new Set(D.jogos.filter(j => j.grupo === g).map(j => j.data).concat(D.presenca.filter(r => r.grupo === g).map(r => r.data)))).sort().reverse().slice(0, 6);
  let h = '<div class="card"><h2>Rodada</h2><div class="row"><div><label>Data · ' + DIAS_SEM[wd] + '</label><input type="date" data-act="data" value="' + esc(S.data) + '"></div></div>';
  if (wd !== esperado) h += '<div class="warn">Atenção: ' + fmtData(S.data) + ' é ' + DIAS_SEM[wd] + ', e o ' + esc(I.curto) + ' joga ' + (esperado === 5 ? 'na sexta' : 'na terça') + '. Confira a data.</div>';
  h += '<div class="chips scroll" style="margin-top:10px"><span class="chip' + (S.data === dataPadrao(g) ? ' on' : '') + '" data-act="setData" data-v="' + dataPadrao(g) + '">Última ' + I.dia.toLowerCase() + '</span>' +
    '<span class="chip' + (S.data === dataProxima(g) ? ' on' : '') + '" data-act="setData" data-v="' + dataProxima(g) + '">Próxima</span>' +
    datas.filter(d => d !== dataPadrao(g) && d !== dataProxima(g)).map(d => '<span class="chip' + (S.data === d ? ' on' : '') + '" data-act="setData" data-v="' + d + '">' + fmtData(d).slice(0, 5) + '</span>').join('') + '</div>';
  h += S.existente ? '<div class="ok">Rodada já lançada nesta data. Ao salvar, ela será substituída pelo que estiver na tela.</div>' + (S.jogos.length ? '<button class="btn sec" data-act="cartao" style="width:100%;margin-top:4px">Gerar imagens da rodada</button><div class="mut" style="margin-top:4px">Usa o que está salvo na planilha. Se alterou algo, salve antes.</div>' : '')
                   : '<div class="mut" style="margin-top:8px">Rodada nova.</div>';
  h += '</div>';

  h += '<div class="card"><h2>Presença <span class="counter">' + came.length + '</span></h2>' +
    '<div class="mut" style="margin-bottom:8px">Toque no nome de quem veio. A etiqueta à direita alterna a confirmação (Não, Sim, Talvez).</div>' +
    '<div class="row" style="margin-bottom:6px"><input id="busca" data-busca="pres" placeholder="Buscar jogador" style="flex:2"><button class="btn sec sm" data-act="confTodos" style="flex:1">Confirmados vieram</button></div>';
  S.pres.forEach((p, i) => {
    h += '<div class="pl" data-nome="' + esc(p.nome.toLowerCase()) + '"><button class="who' + (p.veio ? ' on' : '') + '" data-act="veio" data-i="' + i + '"><span class="chk">✓</span><span class="n">' + esc(p.nome) + '</span></button>' +
      '<span class="chip' + (p.conf === 'Sim' ? ' on' : p.conf === 'Talvez' ? ' on gold' : '') + '" data-act="conf" data-i="' + i + '">' + (p.conf === 'Sim' ? 'Confirmou' : p.conf === 'Talvez' ? 'Talvez' : 'Não conf.') + '</span></div>';
  });
  h += '<div class="row" style="margin-top:12px"><input id="novoNome" placeholder="Jogador novo ou convidado"><button class="btn sec sm" data-act="addNovo" style="flex:0 0 auto">Adicionar</button></div></div>';

  S.jogos.forEach((j, gi) => { h += vJogo(j, gi, came); });
  h += '<button class="btn sec" data-act="addJogo" style="width:100%">+ Adicionar jogo</button>';
  if (S.existente) h += '<button class="btn red sm" data-act="excluir" style="margin-top:16px">Excluir esta rodada</button>';
  h += '<div style="height:70px"></div>';
  return h;
}

function seletorTime(gi, t, atual, outro) {
  const lista = (TIMES[S.grupo] || []).slice();
  if (atual && !lista.includes(atual)) lista.push(atual);
  return '<div class="chips">' + lista.map(n => '<span class="chip' + (n === atual ? ' on' : '') + (n === outro ? ' ghost' : '') + '" data-act="time" data-g="' + gi + '" data-t="' + t + '" data-v="' + esc(n) + '">' + corDot(n) + esc(n) + '</span>').join('') + '</div>';
}

function vJogo(j, gi, came) {
  const auto = placarAuto(j);
  if (!j.manual) { j.p1 = auto[0]; j.p2 = auto[1]; }
  const dif = (j.p1 !== auto[0] || j.p2 !== auto[1]);
  const todos = j.esc1.concat(j.esc2);
  let h = '<div class="card"><div class="jhead"><h2 style="margin:0">Jogo ' + j.n + '</h2><button class="btn red sm" data-act="delJogo" data-g="' + gi + '">Remover</button></div>';
  h += '<h3>Time 1</h3>' + seletorTime(gi, 1, j.t1, j.t2) + '<h3>Time 2</h3>' + seletorTime(gi, 2, j.t2, j.t1);
  h += '<div class="score"><div class="tm">' + corDot(j.t1) + '<span>' + esc(j.t1 || 'Time 1') + '</span></div><div class="mid"><input type="number" inputmode="numeric" min="0" data-act="p1" data-g="' + gi + '" value="' + j.p1 + '"><span class="x">×</span><input type="number" inputmode="numeric" min="0" data-act="p2" data-g="' + gi + '" value="' + j.p2 + '"></div><div class="tm r"><span>' + esc(j.t2 || 'Time 2') + '</span>' + corDot(j.t2) + '</div></div>';
  if (dif) h += '<div class="warn">Os gols lançados somam ' + auto[0] + ' × ' + auto[1] + ', diferente do placar. Confira antes de salvar. <span class="chip" data-act="usarAuto" data-g="' + gi + '">Usar soma dos gols</span></div>';
  [[1, j.t1, j.esc1, j.g1], [2, j.t2, j.esc2, j.g2]].forEach(([t, nome, lista, gk]) => {
    h += '<h3>Escalação · ' + esc(nome || 'Time ' + t) + ' (' + lista.length + ')</h3><div class="chips">';
    came.forEach(n => {
      const outro = (t === 1 ? j.esc2 : j.esc1).includes(n);
      if (outro) return;
      h += '<span class="chip' + (lista.includes(n) ? ' on' : '') + '" data-act="esc" data-g="' + gi + '" data-t="' + t + '" data-n="' + esc(n) + '">' + esc(n) + '</span>';
    });
    h += '</div><div style="margin-top:8px"><label>Goleiro · ' + esc(nome || 'Time ' + t) + '</label><select data-act="gk" data-g="' + gi + '" data-t="' + t + '"><option value="">(não informado)</option>' +
      lista.map(n => '<option' + (n === gk ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select></div>';
  });
  h += '<h3>Gols</h3>';
  j.gols.forEach((x, k) => {
    h += '<div class="golrow"><select data-act="golN" data-g="' + gi + '" data-k="' + k + '"><option value="">Quem fez?</option>' +
      todos.map(n => '<option' + (n === x.nome ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select>' +
      '<span class="stp"><button data-act="golM" data-g="' + gi + '" data-k="' + k + '">−</button><b>' + x.qtd + '</b><button data-act="golP" data-g="' + gi + '" data-k="' + k + '">+</button></span>' +
      '<span class="chip red' + (x.contra ? ' on' : '') + '" data-act="golC" data-g="' + gi + '" data-k="' + k + '">Contra</span>' +

  if (!SOMENTE_LEITURA) h += '<details class="card"' + (compras.length ? '' : '') + '><summary>Registrar compra das bolas</summary><label style="margin-top:10px">O que foi comprado</label><input id="vq_desc" placeholder="2 bolas de campo"><div class="row" style="margin-top:8px"><div><label>Valor (R$)</label><input id="vq_valor" inputmode="decimal" placeholder="150"></div><div><label>Data</label><input id="vq_dcompra" type="date" value="' + esc(hojeISO()) + '"></div></div><button class="btn sec" data-act="vqCompra" style="width:100%;margin-top:10px">Registrar compra</button></details>';

  const total = pagos.reduce((s, r) => s + (Number(r.valor) || 0), 0), falta = pend.reduce((s, r) => s + (Number(r.valor) || 0), 0);

  let h = '<div class="chips scroll" style="margin:4px 0 2px">' + meses.map(m => '<span class="chip' + (m === S.fnMes ? ' on' : '') + '" data-act="fnMesSel" data-v="' + esc(m) + '">' + esc(m) + '</span>').join('') + '</div>';

  h += '</div>';

  c.fillStyle = o.c || '#fff'; c.textAlign = o.a || 'left'; c.textBaseline = o.b || 'alphabetic';

/** Dados do dia */
function dadosDia(grupo, data) {
  const D = db(), f = r => r.grupo === grupo && r.data === data;
  const jogos = D.jogos.filter(f).sort((a, b) => a.n - b.n);
  const esc = D.escalacao.filter(f), gols = D.gols.filter(f), gk = D.goleiros.filter(f), pres = D.presenca.filter(f);
  const rodadas = [...new Set(D.jogos.filter(r => r.grupo === grupo && r.data <= data).map(r => r.data))].sort();
  return { jogos, esc, gols, gk, pres, numRodada: rodadas.indexOf(data) + 1 };
}
function rankear(lista, valor, desc) {
  const l = lista.slice().sort((a, b) => desc ? valor(b) - valor(a) : valor(a) - valor(b));
  let pos = 0, ult = null;
  return l.map((p, i) => { const v = valor(p); if (v !== ult) { pos = i + 1; ult = v; } return { pos, p, v }; });
}

/** Cartão 1: placares + escalações do dia */

  const T = TEMAS[grupo] || TEMAS['Croma 2 Futebol de Sexta'], W = 1080, M = 48, PW = W - M * 2;
  const R = dadosDia(grupo, data);
  const LH = 44;   // altura da linha de jogador
  // altura de cada jogo
  const blocos = R.jogos.map(j => {
    const a = R.esc.filter(r => r.n === j.n && r.time === j.time1), b = R.esc.filter(r => r.n === j.n && r.time === j.time2);
    return { j, a, b, h: 312 + Math.max(a.length, b.length, 1) * LH };
  });
  const H = 330 + blocos.reduce((s, b) => s + b.h + 30, 0) + 60 + 2 * 160 + 20 + 80;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;

  if (T.liga !== 'pl') cvBola(c, W - 100, 110, 52);

  blocos.forEach(B => {
    const j = B.j, p = M;
    cvPainel(c, T, p, y, PW, B.h);
    cvTxt(c, 'JOGO ' + j.n, W / 2, y + 48, { s: 22, w: 800, c: T.mut, a: 'center', ls: 5 });
    // times
    const c1 = corTime(j.time1), c2 = corTime(j.time2);
    const gan = j.p1 > j.p2 ? 1 : j.p2 > j.p1 ? 2 : 0;
    [[1, c1, j.time1, p + 40], [2, c2, j.time2, p + PW - 40]].forEach(([lado, cor, nome, x0]) => {
      const cx = lado === 1 ? x0 + 44 : x0 - 44, cy = y + 128;
      c.beginPath(); c.arc(cx, cy, 44, 0, 7); c.fillStyle = cor.bg; c.fill(); c.lineWidth = 4; c.strokeStyle = 'rgba(255,255,255,.55)'; c.stroke();

      const tx = lado === 1 ? x0 + 104 : x0 - 104, forte = gan === 0 || gan === lado;
      cvFit(c, nome, tx, cy + 12, 190, 34, { w: 900, c: forte ? T.ink : T.mut, a: lado === 1 ? 'left' : 'right' });
    });
    // placar
    const cx = W / 2, cy = y + 150;

    if (T.liga === 'll') { c.lineWidth = 3; c.strokeStyle = T.acc; c.stroke(); }
    const corN = T.liga === 'pl' ? T.onacc : '#fff';

    cvTxt(c, '–', cx, cy + 8, { s: 56, w: 800, c: corN, a: 'center' });
    cvTxt(c, String(j.p2), cx + 70, cy + 18, { s: 86, w: 900, c: corN, a: 'center' });
    if (gan === 0) cvTxt(c, 'EMPATE', cx, cy + 62, { s: 20, w: 800, c: T.mut, a: 'center', ls: 4 });
    else cvTxt(c, 'VITÓRIA ' + (gan === 1 ? j.time1 : j.time2).toUpperCase(), cx, cy + 62, { s: 20, w: 800, c: T.acc2, a: 'center', ls: 3, max: 290 });

    // escalações

    [[B.a, j.time1, p + 24], [B.b, j.time2, p + 24 + cw + 24]].forEach(([lista, time, x0]) => {

      c.fillStyle = cor.bg; cvRR(c, x0, ly, cw, 8, 4); c.fill();

      const golr = (R.gk.find(g => g.n === j.n && g.time === time) || {}).goleiro;

      ord.forEach((e, i) => {

        }
        const w = cvTxt(c, e.nome, x, yy, { s: 30, w: g || gc ? 900 : 600, c: g ? T.ink : (g || gc ? T.ink : 'rgba(255,255,255,.92)'), max: cw - (x - x0) - 110 });
        let bx = x + w + 18;
        if (g) { for (let k = 0; k < Math.min(g, 4); k++) { cvBola(c, bx + 14, yy - 10, 14); bx += 34; } if (g > 4) cvTxt(c, '+' + (g - 4), bx, yy, { s: 22, w: 800, c: T.acc }); }
        if (gc) { cvRR(c, bx, yy - 25, 56, 32, 8); c.fillStyle = '#d7263d'; c.fill(); cvTxt(c, 'GC', bx + 28, yy, { s: 20, w: 900, c: '#fff', a: 'center' }); }

  const art = {}; R.gols.filter(g => g.contra !== 'Sim').forEach(g => art[g.nome] = (art[g.nome] || 0) + Number(g.gols));

    ['GOLEIRO DO DIA', gks.length ? gks[0] : '—', gks.length ? gkd[gks[0]].gs + (gkd[gks[0]].gs === 1 ? ' sofrido em ' : ' sofridos em ') + gkd[gks[0]].gj + (gkd[gks[0]].gj > 1 ? ' jogos' : ' jogo') : 'sem registro'],
    ['PRESENTES', veio.length + ' jogadores', conf.length ? conf.length + ' confirmaram' : 'em campo'],
    ['FURÕES', furoes.length ? String(furoes.length) : 'Ninguém', furoes.length ? furoes.slice(0, 3).join(', ') : 'todos que confirmaram vieram']
  ];
  const tw = (PW - 24) / 2;
  tiles.forEach((t, i) => {
    const x = M + (i % 2) * (tw + 24), yy = y + Math.floor(i / 2) * 160;

    cvTxt(c, t[0], x + 26, yy + 38, { s: 20, w: 800, c: T.acc, ls: 3 });
    cvFit(c, t[1], x + 26, yy + 86, tw - 52, 38, { w: 900, c: T.ink });
    cvTxt(c, t[2], x + 26, yy + 120, { s: 22, w: 600, c: T.mut, max: tw - 52 });
  });
  cvRodape(c, T, W, H);
  return cv;
}

/** Cartão 2: estatísticas da temporada */
function desenharTemporada(grupo, data) {
  const T = TEMAS[grupo] || TEMAS['Croma 2 Futebol de Sexta'], W = 1080, M = 48, PW = W - M * 2;
  const D = db();
  const st = estatisticas(grupo, data);
  const jg = D.jogos.filter(r => r.grupo === grupo && r.data <= data);
  const rodadas = new Set(jg.map(r => r.data)).size, totGols = jg.reduce((s, r) => s + r.p1 + r.p2, 0);
  const art = rankear(st.filter(p => p.gols > 0), p => p.gols, true).filter(r => r.pos <= 8).slice(0, 9);
  let gks = st.filter(p => p.gj >= 2); const minG = gks.length >= 3 ? 2 : 1; gks = st.filter(p => p.gj >= minG);
  const gkr = rankear(gks, p => p.gs / p.gj, false).slice(0, 5);
  const vit = tabelaClass(grupo, data).slice(0, 10);
  const contra = st.filter(p => p.contra > 0).sort((a, b) => b.contra - a.contra);
  const fur = st.filter(p => p.furou > 0).sort((a, b) => b.furou - a.furou);
  const totFur = fur.reduce((s, p) => s + p.furou, 0), totContra = contra.reduce((s, p) => s + p.contra, 0);
  const nA = Math.max(art.length, 1), nG = Math.max(gkr.length, 1), nV = Math.max(vit.length, 1);
  const RH = 62;
  const H = 330 + 190 + (80 + nA * RH + 30) + (80 + nG * RH + 30) + (80 + nV * RH + 30) + 190 + 150;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  cvFundo(c, T, W, H);
  let y = cvCabeca(c, T, W, grupo, 'TEMPORADA  ·  ESTATÍSTICAS', 'Dados até ' + fmtData(data) + '  ·  desde ' + fmtData(jg.map(r => r.data).sort()[0] || data));
  if (T.liga !== 'pl') cvBola(c, W - 100, 110, 52);

  // números gerais
  const nums = [[jg.length, 'JOGOS'], [totGols, 'GOLS'], [rodadas, 'RODADAS'], [totContra, 'GOLS CONTRA'], [totFur, 'FURÕES']];
  const nw = (PW - 4 * 14) / 5;
  nums.forEach((n, i) => {
    const x = M + i * (nw + 14); cvRR(c, x, y, nw, 150, 22); c.fillStyle = T.panel2; c.fill();
    cvTxt(c, String(n[0]), x + nw / 2, y + 86, { s: 64, w: 900, c: T.ink, a: 'center' });
    cvTxt(c, n[1], x + nw / 2, y + 128, { s: 17, w: 800, c: T.acc, a: 'center', ls: 2 });
  });
  y += 190;

  function lista(titulo, itens, desenhaLinha) {
    const n = Math.max(itens.length, 1);
    cvPainel(c, T, M, y, PW, 80 + n * RH + 30);
    cvSecao(c, T, titulo, M + 28, y + 52);
    if (!itens.length) cvTxt(c, 'Sem dados ainda.', M + 28, y + 118, { s: 26, c: T.mut });
    itens.forEach((it, i) => desenhaLinha(it, i, y + 80 + i * RH));
    y += 80 + n * RH + 30 + 30;
  }
  const bar = (x, yy, w, frac, cor) => { cvRR(c, x, yy, w, 12, 6); c.fillStyle = 'rgba(255,255,255,.12)'; c.fill(); if (frac > 0) { cvRR(c, x, yy, Math.max(14, w * frac), 12, 6); c.fillStyle = cor; c.fill(); } };
  const pos = (r, yy, top) => { cvRR(c, M + 28, yy + 8, 48, 40, 10); c.fillStyle = top ? T.acc : 'rgba(255,255,255,.14)'; c.fill(); cvTxt(c, String(r), M + 52, yy + 38, { s: 26, w: 900, c: top ? T.onacc : T.ink, a: 'center' }); };
  lista('CLASSIFICAÇÃO', vit, (p, i, yy) => {
    const lid = i === 0, R = M + PW - 28;
    pos(i + 1, yy, lid);
    cvTxt(c, p.nome, M + 96, yy + 38, { s: 29, w: 800, c: lid ? T.acc : T.ink, max: 330 });
    cvTxt(c, String(p.jogos), R - 360, yy + 38, { s: 26, w: 600, c: T.mut, a: 'right' });
    cvTxt(c, String(p.vit), R - 300, yy + 38, { s: 26, w: 700, c: T.ink, a: 'right' });
    cvTxt(c, String(p.emp), R - 240, yy + 38, { s: 26, w: 700, c: T.ink, a: 'right' });
    cvTxt(c, String(p.jogos - p.vit - p.emp), R - 180, yy + 38, { s: 26, w: 700, c: T.ink, a: 'right' });
    cvTxt(c, String(ptsDe(p)), R - 100, yy + 38, { s: 32, w: 900, c: lid ? T.acc : T.ink, a: 'right' });
    cvTxt(c, Math.round(100 * aprovDe(p)) + '%', R, yy + 38, { s: 24, w: 700, c: T.mut, a: 'right' });
  });
  // legenda das colunas
  { const R = M + PW - 28, yl = y - 30 - 30 - (Math.max(vit.length, 1) * RH) - 80 + 52;
    [['J', 360], ['V', 300], ['E', 240], ['D', 180], ['PTS', 100], ['%', 0]].forEach(k => cvTxt(c, k[0], R - k[1], yl, { s: 18, w: 800, c: T.mut, a: 'right', ls: 1 })); }
  const maxG = art.length ? art[0].v : 1;
  lista('ARTILHARIA', art, (r, i, yy) => {
    pos(r.pos, yy, r.pos === 1);
    cvTxt(c, r.p.nome, M + 96, yy + 30, { s: 30, w: 800, c: T.ink, max: 330 });
    bar(M + 96, yy + 40, 470, r.v / maxG, r.pos === 1 ? T.acc : T.acc2);
    cvTxt(c, r.v + (r.v > 1 ? ' gols' : ' gol'), M + PW - 28, yy + 38, { s: 30, w: 900, c: r.pos === 1 ? T.acc : T.ink, a: 'right' });
  });
  lista('GOLEIRO MENOS VAZADO', gkr, (r, i, yy) => {
    pos(r.pos, yy, r.pos === 1);
    cvTxt(c, r.p.nome, M + 96, yy + 38, { s: 30, w: 800, c: T.ink, max: 400 });
    cvTxt(c, r.v.toFixed(2).replace('.', ',') + ' sofridos/jogo', M + PW - 28, yy + 30, { s: 28, w: 900, c: r.pos === 1 ? T.acc : T.ink, a: 'right' });
    cvTxt(c, r.p.gj + (r.p.gj > 1 ? ' jogos' : ' jogo') + '  ·  ' + r.p.gs + ' gols sofridos', M + PW - 28, yy + 54, { s: 18, w: 600, c: T.mut, a: 'right' });
  });
  // gols contra e furões
  const tw = (PW - 24) / 2;
  [['GOLS CONTRA', contra.map(p => p.nome + ' (' + p.contra + ')'), 'nenhum gol contra'], ['FURÕES', fur.map(p => p.nome + ' (' + p.furou + 'x)'), 'ninguém furou']].forEach((b, i) => {
    const x = M + i * (tw + 24);
    cvRR(c, x, y, tw, 160, 22); c.fillStyle = T.panel2; c.fill();
    cvTxt(c, b[0], x + 26, y + 46, { s: 22, w: 900, c: T.acc, ls: 3 });
    const itens = b[1].length ? b[1] : [b[2]];
    let ln = '', yy = y + 92;
    itens.forEach(t => { const prox = ln ? ln + ', ' + t : t; c.font = '700 26px ' + FONTE; if (c.measureText(prox).width > tw - 52 && ln) { cvTxt(c, ln + ',', x + 26, yy, { s: 26, w: 700, c: T.ink }); yy += 38; ln = t; } else ln = prox; });
    if (ln && yy < y + 150) cvTxt(c, ln, x + 26, yy, { s: 26, w: 700, c: b[1].length ? T.ink : T.mut });
  });
  cvRodape(c, T, W, H);
  return cv;
}

const CART = { cv: [null, null], aba: 0, grupo: '', data: '' };
function abrirCartoes(dia) {
  const g = S.grupo, d = dia || S.data;

  try { CART.cv = [desenharRodada(g, d), desenharTemporada(g, d)]; }

}

  document.querySelectorAll('#dlgCard [data-act=cartaoAba]').forEach(b => b.classList.toggle('on', +b.dataset.k === CART.aba));
}
function nomeArquivo() { return (CART.aba === 0 ? 'rodada' : 'temporada') + '_' + CART.grupo.split(' ')[0].toLowerCase() + '_' + CART.data + '.png'; }
function cartaoBlob() { return new Promise(r => CART.cv[CART.aba].toBlob(r, 'image/png')); }
async function cartaoBaixar() {
  const b = await cartaoBlob(), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nomeArquivo();
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function cartaoCompartilhar() {
  const b = await cartaoBlob(), f = new File([b], nomeArquivo(), { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], title: CART.grupo }); } catch (e) { /* cancelado */ } }
  else { await cartaoBaixar(); toast('Imagem baixada. Envie pelo WhatsApp.'); }
}

/* ====================== AÇÕES ====================== */
async function salvarRodada() {
  const probs = [];
  S.jogos.forEach(j => {
    if (!j.t1 || !j.t2) probs.push('Jogo ' + j.n + ': informe os dois times.');
    else if (j.t1 === j.t2) probs.push('Jogo ' + j.n + ': os times são iguais.');
    j.gols.forEach(x => { if (!x.nome) probs.push('Jogo ' + j.n + ': há gol sem jogador.'); });
  });
  if (!S.pres.some(p => p.veio) && S.jogos.length) probs.push('Marque quem veio na presença.');
  if (probs.length) { S.msg = { t: 'err', m: probs.join(' ') }; render(); window.scrollTo(0, 0); return; }
  const dif = S.jogos.filter(j => { const a = placarAuto(j); return a[0] !== j.p1 || a[1] !== j.p2; });
  if (dif.length && !confirm('O placar de ' + dif.length + ' jogo(s) não bate com a soma dos gols. Salvar assim mesmo?')) return;
  const body = {
    action: 'salvarRodada', grupo: S.grupo, data: S.data,
    novosJogadores: S.novos,
    presenca: S.pres.map(p => ({ nome: p.nome, confirmado: p.conf, compareceu: p.veio ? 'Sim' : 'Não', obs: p.obs })),
    jogos: S.jogos.map(j => ({
      n: j.n, time1: j.t1, time2: j.t2, p1: j.p1, p2: j.p2, obs: j.obs, esc1: j.esc1, esc2: j.esc2, g1: j.g1, g2: j.g2,
      gols: j.gols.map(x => ({ nome: x.nome, time: j.esc1.includes(x.nome) ? j.t1 : j.t2, gols: x.qtd, contra: x.contra }))
    }))
  };
  const btn = document.querySelector('#sticky .btn'); if (btn) { btn.disabled = true; btn.textContent = 'Salvando…'; }
  try {
    const r = await apiGravar(body);
    toast('Rodada salva: ' + r.jogos + ' jogos, ' + r.gols + ' linhas de gols', 3500);
    S.msg = { t: 'ok', m: 'Rodada de ' + fmtData(S.data) + ' salva na planilha.' };
    await carregar(true);
  } catch (e) { S.msg = { t: 'err', m: e.message }; render(); }
  window.scrollTo(0, 0);
}
async function excluirRodada() {
  if (!confirm('Excluir toda a rodada de ' + fmtData(S.data) + ' (' + S.grupo + ') da planilha?')) return;
  try { const r = await apiGravar({ action: 'excluirRodada', grupo: S.grupo, data: S.data }); toast(r.apagadas + ' linhas removidas'); await carregar(true); }
  catch (e) { S.msg = { t: 'err', m: e.message }; render(); }
}
async function alternarAtivo(g, n) {
  const p = db().jogadores.find(x => x.grupo === g && x.nome === n); if (!p) return;
  const novo = p.ativo === 'Não' ? 'Sim' : 'Não';
  try { await apiGravar({ action: 'salvarJogador', grupo: g, nome: n, ativo: novo }); p.ativo = novo; S.carregadoKey = ''; render(); }
  catch (e) { S.msg = { t: 'err', m: e.message }; render(); }
}
async function addJogador(g, nome) {
  nome = (nome || '').trim(); if (!nome) return;
  try { await apiGravar({ action: 'salvarJogador', grupo: g, nome: nome, ativo: 'Sim' }); toast('Jogador adicionado'); await carregar(true); }
  catch (e) { S.msg = { t: 'err', m: e.message }; render(); }
}
async function alternarPagamento(n) {
  const r = db().financeiro.find(x => x.grupo === S.fnGrupo && x.nome === n && String(x.mes).toLowerCase() === S.fnMes.toLowerCase()); if (!r) return;
  const ciclo = { 'Não': 'Sim', 'Sim': 'Isento', 'Isento': 'Não' }, novo = ciclo[r.pago] || 'Sim';
  const dataP = novo === 'Sim' ? hojeISO() : '';
  try {
    await apiGravar({ action: 'salvarPagamento', grupo: S.fnGrupo, nome: n, mes: S.fnMes, valor: r.valor, pago: novo, dataPgto: dataP });
    r.pago = novo; r.dataPgto = dataP; render();
  } catch (e) { S.msg = { t: 'err', m: e.message }; render(); }
}
async function gerarMes() {
  const v = document.getElementById('fnValor').value; S.fnValor = v; const mm = document.getElementById('fnMesNovo'); if (mm && mm.value.trim()) S.fnMes = mm.value.trim();
  if (!v) { toast('Informe o valor da mensalidade'); return; }
  try { const r = await apiGravar({ action: 'gerarMes', grupo: S.fnGrupo, mes: S.fnMes, valor: Number(v) }); toast(r.criadas + ' linhas criadas'); await carregar(true); }
  catch (e) { S.msg = { t: 'err', m: e.message }; render(); }
}

/* ====================== INÍCIO ====================== */
render();
if (!SOMENTE_LEITURA && cfg.url) carregar();
</script>
